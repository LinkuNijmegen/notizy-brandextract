[program:application]
directory=/projects/notizybra_aa
command=/projects/notizybra_aa/.venv/bin/gunicorn config.wsgi:application --workers 3 --timeout 120 --bind 127.0.0.1:8000
environment=DJANGO_DEBUG="False",DJANGO_SECRET_KEY="CHANGE-ME",DJANGO_ALLOWED_HOSTS="brandextract.notizy.nl",DJANGO_CSRF_TRUSTED_ORIGINS="https://brandextract.notizy.nl",DJANGO_SECURE_SSL="False",GOOGLE_OIDC_CLIENT_ID="CHANGE-ME",GOOGLE_OIDC_CLIENT_SECRET="CHANGE-ME",GOOGLE_WORKSPACE_DOMAINS="notizy.com,linku.nl"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/brandextract.log
