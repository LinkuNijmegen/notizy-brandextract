server {
    listen 80;
    server_name extractor.example.com;

    # Moet minstens zo groot zijn als DATA_UPLOAD_MAX_MEMORY_SIZE in settings.py
    client_max_body_size 50m;

    location /static/ {
        alias /srv/brandextract/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://unix:/run/brandextract.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extractie van grote DOCX-bestanden duurt seconden
        proxy_read_timeout 120s;
    }
}
